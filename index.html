<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ── Receptor PeerJS (este es el que va en OBS) ──
var PEER_ID = 'obs-inferior-montenegro';
var peerOBS = null;
var estado = document.createElement('div');
estado.style.cssText = 'position:fixed;bottom:4px;right:4px;padding:4px 10px;font:12px sans-serif;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;z-index:9999;pointer-events:none;';
document.body.appendChild(estado);

function iniciarPeer(){
  estado.textContent = '⏳ Conectando...';
  peerOBS = new Peer(PEER_ID);

  peerOBS.on('open', function(id){
    estado.textContent = '✅ Listo — ID: ' + id;
    // Ocultar el indicador después de 5 segundos
    setTimeout(function(){ estado.style.display = 'none'; }, 5000);
  });

  peerOBS.on('connection', function(conn){
    conn.on('data', function(data){
      console.log('Recibido:', data);
      if (data === 'mostrar' && !window.bannerOcupado()){
        window.bannerMostrar();
      } else if (data === 'ocultar' && !window.bannerOcupado()){
        window.bannerOcultar();
      }
    });
  });

  peerOBS.on('error', function(err){
    console.error('PeerJS error:', err);
    estado.style.display = '';
    if (err.type === 'unavailable-id'){
      estado.textContent = '⚠️ ID en uso, reintentando...';
      setTimeout(iniciarPeer, 3000);
    } else {
      estado.textContent = '❌ Error: ' + err.type;
      setTimeout(iniciarPeer, 5000);
    }
  });

  peerOBS.on('disconnected', function(){
    estado.style.display = '';
    estado.textContent = '🔄 Reconectando...';
    setTimeout(function(){ peerOBS.reconnect(); }, 2000);
  });
}

iniciarPeer();
</script>
